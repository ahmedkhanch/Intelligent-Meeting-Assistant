[pytest]
# Test discovery: only look under tests/ and treat the project root as importable
# so `app.*` resolves without any sys.path hacks in test code.
testpaths = tests
pythonpath = .

# pytest-asyncio: auto-detect async tests & fixtures (no @pytest.mark.asyncio needed).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# Terse but informative output.
addopts = -ra -q

filterwarnings =
    # datetime.utcnow() is deprecated in 3.12+; still used by fallback_store.
    ignore:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning
